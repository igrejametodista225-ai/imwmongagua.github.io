<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Agenda IMW Mongaguá</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E5E58">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: app de celular — barra superior fixa, filtros por ministério, conteúdo rolável e navegação inferior (Semana · Mês · Ano · Buscar) */
:root{
  --bg:#F2F5F3; --card:#FFFFFF; --ink:#13231F; --muted:#5B6C67; --line:#DCE4E1;
  --accent:#0E5E58; --accent-ink:#FFFFFF; --bar:#0E5E58; --bar-ink:#FFFFFF; --gold:#B9801F; --gold-soft:#F7ECD6;
  --chip-l:92%; --chip-t:27%; --chip-s:48%;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1513; --card:#13201D; --ink:#E4EDEA; --muted:#93A7A1; --line:#22332F;
  --accent:#5BC2B4; --accent-ink:#06211D; --bar:#103A35; --bar-ink:#E4EDEA; --gold:#E4B465; --gold-soft:#2E2617;
  --chip-l:21%; --chip-t:84%; --chip-s:32%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1513; --card:#13201D; --ink:#E4EDEA; --muted:#93A7A1; --line:#22332F;
  --accent:#5BC2B4; --accent-ink:#06211D; --bar:#103A35; --bar-ink:#E4EDEA; --gold:#E4B465; --gold-soft:#2E2617;
  --chip-l:21%; --chip-t:84%; --chip-s:32%; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px 10px}
.brand{flex:1;min-width:0}
.logo{flex:none;width:46px;height:46px;border-radius:50%;padding:0;overflow:hidden;box-shadow:0 0 0 2px color-mix(in srgb,var(--bar-ink) 35%,transparent)}
.logo img{width:100%;height:100%;display:block}
.sheet{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,#000 55%,transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{width:100%;max-width:520px;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;padding:28px max(20px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.sheet-card img{width:128px;height:128px;border-radius:50%;box-shadow:0 0 0 1px var(--line);margin-bottom:8px}
.sheet-card h2{margin:0;font-family:var(--f-display);font-size:24px}
.lema{color:var(--gold);font-weight:600;letter-spacing:.02em}
.addr{margin:12px 0 4px;color:var(--ink);line-height:1.5}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn svg{width:18px;height:18px}
.iconbtn{position:relative}
.badge{position:absolute;top:-4px;right:-4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--gold);color:#1a1205;font-size:10.5px;font-weight:700;line-height:16px;text-align:center}
.av-card{align-items:stretch;text-align:left;gap:12px;max-height:85vh;overflow:auto}
.av-head{display:flex;align-items:center;gap:10px}
.av-head svg{width:24px;height:24px;color:var(--gold);flex:none}
.av-head h2{flex:1;font-size:21px}
.aviso{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:12px 14px;background:var(--bg)}
.aviso h3{margin:0 0 4px;font-size:16px;font-family:var(--f-display)}
.aviso p{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.aviso a{color:var(--accent);font-weight:600}
.aviso small{display:block;margin-top:6px;color:var(--muted);font-size:12px}
.av-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.av-actions .btn{justify-content:center}
.av-empty{color:var(--muted);text-align:center;padding:12px 0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.1;margin:0}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--bar-ink) 14%,transparent)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status{font-size:12px;padding-block:0 10px;opacity:.85}

/* filtros */
.filters{background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--toph,96px));z-index:15}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:500;background:var(--card);white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}

/* navegação de período */
.period{display:flex;align-items:center;gap:8px;padding-block:14px 6px}
.period h2{flex:1;font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
.navbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.navbtn svg{width:18px;height:18px}
.pill{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600}
.notice{margin-block:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--ink);font-size:13px}

/* lista de dias */
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:52px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line);scroll-margin-top:170px}
.day:last-child{border-bottom:0}
.dnum{text-align:center;padding-top:2px}
.dnum b{display:block;font-family:var(--f-display);font-size:24px;line-height:1;font-variant-numeric:tabular-nums}
.dnum span{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.day.today .dnum b{color:var(--gold)}
.day.today .dnum span{color:var(--gold);font-weight:600}
.day.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
.items{display:flex;flex-direction:column;gap:8px;min-width:0}
.item{display:grid;grid-template-columns:48px 1fr;gap:8px;align-items:baseline}
.time{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--accent)}
.time.none{color:var(--muted);font-weight:500;font-size:12px}
.ttl{font-weight:500;min-width:0;overflow-wrap:anywhere}
.item.evento .ttl{font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;
  background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) 45% var(--chip-t))}
.tag.ev{background:var(--gold-soft);color:var(--gold)}
.note{font-size:13px;color:var(--muted);font-style:italic}
.empty{color:var(--muted);font-size:13px;padding-top:4px}
.day.quiet{padding-block:8px}
.day.quiet .dnum b{font-size:18px;color:var(--muted)}

/* mês */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-block:6px 14px}
.cal .wd{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-block:4px}
.cd{aspect-ratio:1/1;max-width:100%;border-radius:12px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px}
.cd.blank{background:transparent;border-color:transparent}
.cd.has{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.cd.none{color:var(--muted);font-weight:400}
.cd.today{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 55% 45%)}
.sect{font-family:var(--f-display);font-size:15px;font-weight:700;margin:10px 0 0;color:var(--muted);letter-spacing:.02em}

/* ano */
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;padding-block:8px 16px}
.mcard{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.mcard.cur{border-color:var(--gold)}
.mhead{display:flex;align-items:baseline;gap:8px}
.mhead h3{flex:1;margin:0;font-family:var(--f-display);font-size:18px;font-weight:700}
.mhead small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.hl{display:grid;grid-template-columns:28px 1fr;gap:6px;font-size:13.5px}
.hl b{font-variant-numeric:tabular-nums;color:var(--accent)}
.more{font-size:12px;color:var(--muted)}

/* busca */
.search{display:flex;gap:8px;padding-block:14px 6px}
.search input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.mlabel{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 0}

/* barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:9px 8px;font-size:12px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>

function norm(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim(); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function key(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function fromKey(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function startOfWeek(d){ return addDays(d,-d.getDay()); }

function load(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function hue(name){ let h=0; for(const c of norm(name)) h=(h*31+c.charCodeAt(0))%360; return h; }
const HUES = {"pastoral":200,"intercessao":275,"acao social":28,"evangelismo":150,"louvor":330,"lideranca":215,"escola familia":95,"trilha":175,"mulheres":345,"diplomacia":50,"regional":0,"casais":12,"infantil":60,"60+":190,"juventude":120,"conectar":245};
function hueOf(m){ const n=norm(m); return n in HUES ? HUES[n] : hue(m); }

/* ---- CSV ---- */
function parseCSV(text){
  text=String(text||"").replace(/^\uFEFF/,"");
  const rows=[]; let row=[], f="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=""; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if(f!==""||row.length){ row.push(f); rows.push(row); }
  return rows;
}

/* ---- planilha -> agenda ---- */
const TIME_RE = /^(\d{1,2})\s*(?:[:hH]\s*(\d{2})|[hH](?=\s|$))\s*(?:h\b)?\s*[-–]?\s*(.*)$/;
function lines(v){ return String(v||"").split(/\r?\n/).map(s=>s.replace(/\s+/g," ").trim()).filter(Boolean); }
function parseLine(s){
  const m=s.match(TIME_RE);
  if(!m || +m[1]>23 || (m[2]!==undefined && +m[2]>59)) return {t:"", title:s};
  if(m[2]===undefined && /^de\s/i.test(m[3])) return {t:"", title:s}; // ex.: "2h de jejum" não é horário
  return {t:pad(+m[1])+":"+(m[2]||"00"), title:m[3]||s};
}

function parseSheet(rows, fallbackYear){
  let year=null, hdr=-1;
  for(let i=0;i<Math.min(rows.length,12);i++){
    const joined=rows[i].join(" ");
    const y=joined.match(/\b(20\d{2})\b/); if(!year&&y) year=+y[1];
    const n=rows[i].map(norm);
    if(n.includes("mes")&&n.includes("dia")){ hdr=i; break; }
  }
  if(hdr<0) throw new Error("Cabeçalho MÊS / DIA não encontrado");
  year = year || fallbackYear || new Date().getFullYear();
  const H=rows[hdr].map(norm);
  const iM=H.indexOf("mes"), iD=H.indexOf("dia");
  const iA=H.findIndex(h=>h.startsWith("agenda")), iE=H.findIndex(h=>h.startsWith("evento")), iO=H.findIndex(h=>h.startsWith("obs"));
  const days={}; let lastMi;
  for(let r=hdr+1;r<rows.length;r++){
    const row=rows[r]; const mtxt=norm(row[iM]); const dn=parseInt(row[iD],10);
    let mi=MES_IDX[mtxt]; if(mi===undefined && !mtxt && dn) mi=lastMi; // mês em branco = mesmo mês da linha anterior
    if(mi!==undefined) lastMi=mi;
    if(mi===undefined||!dn) continue;
    const date=new Date(year,mi,dn); if(date.getMonth()!==mi) continue;
    const k=key(date);
    const day=days[k]||(days[k]={k, items:[], mins:[], notes:[]});
    const addGroup=(txt,minTxt,kind)=>{
      const ls=lines(txt), ms=[...new Set(lines(minTxt).map(m=>m.toUpperCase()))];
      const unamb = ls.length===1 || ms.length===1;
      ls.forEach(l=>{
        if(kind==="evento" && /^sob dire/i.test(l)){ day.notes.push(l); return; }
        const p=parseLine(l);
        const dup=day.items.find(x=>norm(x.title)===norm(p.title)&&x.t===p.t);
        if(dup){ if(unamb) ms.forEach(m=>{ if(!dup.mins.includes(m)) dup.mins.push(m); }); if(kind==="evento") dup.kind="evento"; return; }
        day.items.push({t:p.t, title:p.title, mins: unamb?ms.slice():[], kind});
      });
      if(!unamb) ms.forEach(m=>{ if(!day.mins.includes(m)) day.mins.push(m); });
    };
    if(iA>=0) addGroup(row[iA], row[iA+1], "agenda");
    if(iE>=0) addGroup(row[iE], row[iE+1], "evento");
    if(iO>=0) lines(row[iO]).forEach(o=>day.notes.push(o));
  }
  Object.values(days).forEach(d=>d.items.sort((a,b)=>(a.t||"99")<(b.t||"99")?-1:(a.t||"99")>(b.t||"99")?1:0));
  return {year, days};
}

function buildData(sheets){
  const days={}, years=new Set();
  sheets.forEach(s=>{ years.add(s.year); Object.assign(days,s.days); });
  const keys=Object.keys(days).sort();
  const mins=new Set(); const freq={};
  Object.values(days).forEach(d=>{ d.mins.forEach(m=>mins.add(m)); d.items.forEach(it=>{ it.mins.forEach(m=>mins.add(m)); const n=routineKey(it.title); freq[n]=(freq[n]||0)+1; }); });
  return {days, keys, years:[...years].sort(), mins:[...mins].sort((a,b)=>a.localeCompare(b,"pt")), freq};
}
function routineKey(t){ return norm(t).replace(/[0-9ºª°]+/g,"").replace(/\s+/g," ").trim(); }

function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function clampToData(d){
  const ks=S.data.keys; if(!ks.length) return d;
  const first=fromKey(ks[0]), last=fromKey(ks[ks.length-1]);
  return d<first?first:d>last?last:d;
}

/* ---- filtro ---- */
function itemMatches(it,day){
  if(!S.filtro) return true;
  return it.mins.includes(S.filtro) || (!it.mins.length && day.mins.includes(S.filtro));
}
function visibleItems(day){ return day? day.items.filter(it=>itemMatches(it,day)) : []; }

/* ---- render ---- */
function tagsHTML(ms, ev){
  const t = ms.map(m=>`<span class="tag" style="--h:${hueOf(m)}">${esc(m)}</span>`).join("");
  return (t||ev) ? `<div class="tags">${ev?'<span class="tag ev">Evento</span>':""}${t}</div>` : "";
}
function dayHTML(k, opts={}){
  const d=fromKey(k), day=S.data.days[k], its=opts.only||visibleItems(day);
  const isToday = k===key(today());
  if(!its.length && opts.skipEmpty) return "";
  const quiet = !its.length;
  let body;
  if(quiet) body=`<div class="empty">Sem atividades</div>`;
  else {
    body = its.map(it=>`<div class="item ${it.kind==="evento"?"evento":""}"><span class="time ${it.t?"":"none"}">${it.t||"dia todo"}</span><div class="ttl">${esc(it.title)}${tagsHTML(it.mins, it.kind==="evento")}</div></div>`).join("");
    const shared = day.mins.filter(m=>!S.filtro||m===S.filtro);
    if(shared.length && its.some(it=>!it.mins.length)) body += `<div class="item"><span></span><div>${tagsHTML(shared,false)}</div></div>`;
    if(day.notes.length) body += day.notes.map(n=>`<div class="item"><span></span><div class="note">${esc(n)}</div></div>`).join("");
  }
  return `<article class="day ${quiet?"quiet":""} ${isToday?"today":""}" id="d-${k}"><div class="dnum"><b>${d.getDate()}</b><span>${isToday?"Hoje":DS[d.getDay()]}</span></div><div class="items">${body}</div></article>`;
}

const ICON_R='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';

}
function outOfRangeNotice(){
  const t=today(), ks=S.data.keys; if(!ks.length) return "";
  if(S.view==="semana"){ const ws=startOfWeek(S.cursor), we=addDays(ws,6); if(!((fromKey(ks[0])>=ws&&fromKey(ks[0])<=we)||(fromKey(ks[ks.length-1])>=ws&&fromKey(ks[ks.length-1])<=we))) return ""; }
  const first=fromKey(ks[0]), last=fromKey(ks[ks.length-1]);
  if(t<first) return `<div class="notice">A agenda publicada começa em ${first.getDate()} de ${MESES[first.getMonth()]} de ${first.getFullYear()}.</div>`;
  if(t>last) return `<div class="notice">A agenda publicada vai até ${last.getDate()} de ${MESES[last.getMonth()]} de ${last.getFullYear()}.</div>`;
  return "";
}

function renderSemana(){
  const s=startOfWeek(S.cursor), e=addDays(s,6);
  const lbl = s.getMonth()===e.getMonth()
    ? `${s.getDate()} – ${e.getDate()} de ${MESES[e.getMonth()]}`
    : `${s.getDate()} ${MESES[s.getMonth()].slice(0,3)} – ${e.getDate()} ${MESES[e.getMonth()].slice(0,3)}`;
  let h = periodHTML(`${lbl} <small style="color:var(--muted);font-weight:500">${e.getFullYear()}</small>`, `<button class="pill" data-hoje>Hoje</button>`) + outOfRangeNotice();
  h += `<section class="days">`; for(let i=0;i<7;i++) h+=dayHTML(key(addDays(s,i))); h+=`</section>`;
  return h;
}
function renderMes(){
  const y=S.cursor.getFullYear(), m=S.cursor.getMonth();
  const first=new Date(y,m,1), nd=new Date(y,m+1,0).getDate();
  let g=DS.map(d=>`<div class="wd">${d[0]}</div>`).join("");
  for(let i=0;i<first.getDay();i++) g+=`<div class="cd blank"></div>`;
  const tk=key(today());
  let list="";
  for(let d=1; d<=nd; d++){
    const k=key(new Date(y,m,d)), its=visibleItems(S.data.days[k]);
    const ms=[...new Set(its.flatMap(it=>it.mins.length?it.mins:(S.data.days[k].mins)))].slice(0,3);

function renderAno(){
  const y=S.cursor.getFullYear(), tm = today().getFullYear()===y ? today().getMonth() : -1;
  let h = periodHTML(`Ano de ${y}`) + `<p class="note" style="margin:0">Destaques de cada mês (cultos e reuniões semanais ficam na visão de mês).</p><div class="year">`;
  for(let m=0;m<12;m++){
    const nd=new Date(y,m+1,0).getDate(); let count=0; const hl=[];
    for(let d=1; d<=nd; d++){
      const k=key(new Date(y,m,d)), day=S.data.days[k]; const its=visibleItems(day); count+=its.length;
      its.forEach(it=>{ if(S.filtro || (S.data.freq[routineKey(it.title)]||0)<6) hl.push({d, title:it.title}); });
    }
    const seen=new Set(), uniq=hl.filter(x=>{ const kk=routineKey(x.title); if(seen.has(kk)) return false; seen.add(kk); return true; });
    const show=uniq.slice(0,5);
    h+=`<button class="mcard ${m===tm?"cur":""}" data-mes="${m}"><div class="mhead"><h3>${MESES[m][0].toUpperCase()+MESES[m].slice(1)}</h3><small>${count} atividade${count===1?"":"s"}</small></div>`
      + (show.length? show.map(x=>`<div class="hl"><b>${pad(x.d)}</b><span>${esc(x.title)}</span></div>`).join("") : `<div class="more">Sem destaques</div>`)
      + (uniq.length>show.length? `<div class="more">+ ${uniq.length-show.length} outro${uniq.length-show.length>1?"s":""}</div>`:"") + `</button>`;
  }
  return h+`</div>`;
}
function renderBusca(){
  return `<div class="search"><input id="q" type="search" placeholder="Buscar: culto, vigília, retiro…" value="${esc(S.busca)}" autocomplete="off" aria-label="Buscar atividade"></div><div id="res">${buscaRes()}</div>`;
}
function buscaRes(){
  const q=norm(S.busca);
  if(!q && !S.filtro) return `<p class="empty">Digite parte do nome de uma atividade ou escolha um ministério acima.</p>`;
  let lastM=-1, out="", n=0;
  for(const k of S.data.keys){
    const day=S.data.days[k];
    const its=visibleItems(day).filter(it=>!q||norm(it.title).includes(q)||it.mins.some(m=>norm(m).includes(q)));
    if(!its.length) continue;
    const d=fromKey(k); if(d.getMonth()!==lastM){ lastM=d.getMonth(); out+=`<h3 class="mlabel">${MESES[lastM]} ${d.getFullYear()}</h3>`; }
    out+=dayHTML(k,{only:its}); n+=its.length;
    if(n>400) break;
  }
  return out?`<p class="note" style="margin:6px 0 0">${n} resultado${n===1?"":"s"}</p><section class="days">${out}</section>`:`<p class="empty">Nada encontrado.</p>`;
}
function renderChips(){
  if(S.filtro && !S.data.mins.includes(S.filtro)) S.filtro="";
  const el=document.getElementById("chips");
  el.innerHTML=[`<button class="fchip" data-f="" aria-pressed="${!S.filtro}">Todos</button>`]
    .concat(S.data.mins.map(m=>`<button class="fchip" data-f="${esc(m)}" aria-pressed="${S.filtro===m}">${esc(m.charAt(0)+m.slice(1).toLowerCase())}</button>`)).join("");
}
function render(){
  if(!S.data) return;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current", t.dataset.v===S.view?"page":"false"));
  const v=document.getElementById("view");
  v.innerHTML = S.view==="mes"?renderMes(): S.view==="ano"?renderAno(): S.view==="busca"?renderBusca(): renderSemana();
  if(S.view==="busca"){ const q=document.getElementById("q"); q.addEventListener("input",()=>{ S.busca=q.value; document.getElementById("res").innerHTML=buscaRes(); }); }
  document.getElementById("status").textContent=S.status;
  const yrs=S.data.years; document.getElementById("apptitle").textContent="Agenda "+(yrs.length?yrs.join(" · "):"");
  syncTop();
}
function syncTop(){ const h=document.getElementById("top").offsetHeight; document.documentElement.style.setProperty("--toph",h+"px"); }

/* ---- eventos ---- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.v){ S.view=t.dataset.v; savePref(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.f!==undefined){ S.filtro=t.dataset.f; renderChips(); render(); return; }
  if(t.dataset.nav){
    const n=+t.dataset.nav;
    if(S.view==="semana") S.cursor=addDays(S.cursor,7*n);
    else if(S.view==="mes") S.cursor=new Date(S.cursor.getFullYear(),S.cursor.getMonth()+n,1);
    else S.cursor=new Date(S.cursor.getFullYear()+n,0,1);
    render(); return;
  }
  if(t.hasAttribute("data-hoje")){ S.cursor=clampToData(today()); render(); return; }
  if(t.dataset.mes!==undefined){ S.cursor=new Date(S.cursor.getFullYear(),+t.dataset.mes,1); S.view="mes"; savePref(); render(); window.scrollTo(0,0); return; }
  if(t.dataset.go){ const el=document.getElementById("d-"+t.dataset.go); if(el){ el.scrollIntoView({behavior:"smooth",block:"start"}); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); } else { S.cursor=fromKey(t.dataset.go); S.view="semana"; render(); } return; }
  if(t.id==="refresh"){ carregar(true); carregarAvisos(); return; }
  if(t.id==="sobre"){ abrirSobre(true); return; }
  if(t.id==="s-fechar"){ abrirSobre(false); return; }
});
window.addEventListener("resize",syncTop);

/* ---- carregamento ---- */
function fmt(ts){ const d=new Date(ts); return `${pad(d.getDate())}/${pad(d.getMonth()+1)} às ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function aplicar(sheetsRows, status){
  const sheets=sheetsRows.map(r=>parseSheet(r));
  S.data=buildData(sheets); S.status=status;
  if(!S.cursor) S.cursor=clampToData(today());
  renderChips(); render();
}
async function carregar(manual){
  const btn=document.getElementById("refresh");
  const urls=(CONFIG.planilhas||[]).filter(Boolean);
  if(!urls.length){
    aplicar([EMBUTIDA.linhas], `Cópia embutida da planilha (${EMBUTIDA.data})`);
    return;
  }
  btn.classList.add("spin");
  try{
    const texts=await Promise.all(urls.map(u=>fetch(u+(u.includes("?")?"&":"?")+"_t="+Date.now(),{cache:"no-store"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.text(); })));
    const rows=texts.map(parseCSV);
    try{ rows.forEach(r=>{ const sh=parseSheet(r); if(!Object.keys(sh.days).length) throw new Error("vazia"); }); }catch(e){ e.formato=true; throw e; } // valida antes de salvar
    const ts=Date.now(); store(CACHE_KEY,{ts, rows});
    aplicar(rows, `Atualizado em ${fmt(ts)}`);
  }catch(err){
    const motivo = (err && err.formato) ? "Não foi possível ler a planilha publicada" : "Sem conexão";
    const c=load(CACHE_KEY);
    if(c&&c.rows) aplicar(c.rows, `${motivo}. Mostrando a versão de ${fmt(c.ts)}.`);
    else aplicar([EMBUTIDA.linhas], `${motivo}. Mostrando a cópia embutida (${EMBUTIDA.data}).`);
  }finally{ btn.classList.remove("spin"); }
}
document.getElementById("church").textContent=CONFIG.igreja;
document.getElementById("s-nome").textContent=CONFIG.igreja;
document.getElementById("s-lema").textContent=CONFIG.lema||"";
document.getElementById("s-end").textContent=CONFIG.endereco||"";
document.getElementById("s-mapa").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(CONFIG.igreja+", "+(CONFIG.endereco||""));
/* janelas (sobre e avisos): o botão Voltar do celular fecha a janela em vez de sair do app */
function abrirFolha(id){ const el=document.getElementById(id); if(!el.hidden) return; el.hidden=false; try{ history.pushState({folha:id},""); }catch(e){} }
function fecharFolha(id){ const el=document.getElementById(id); if(el.hidden) return; el.hidden=true; try{ if(history.state&&history.state.folha===id) history.back(); }catch(e){} }
window.addEventListener("popstate",()=>{ ["sheet","avsheet"].forEach(id=>{ const el=document.getElementById(id); if(!el.hidden){ el.hidden=true; if(id==="avsheet") atualizarBadge(); } }); });
function abrirSobre(on){ if(on){ abrirFolha("sheet"); document.getElementById("s-fechar").focus(); } else { fecharFolha("sheet"); document.getElementById("sobre").focus(); } }
document.getElementById("sheet").addEventListener("click",e=>{ if(e.target.id==="sheet") abrirSobre(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("sheet").hidden) abrirSobre(false); });
/* ---- avisos ---- */
let AVISOS=[];
function parseData(v){
  v=String(v||"").trim(); if(!v) return null; let m;
  if((m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){ const y=+m[3]<100?2000+ +m[3]:+m[3]; return new Date(y,+m[2]-1,+m[1]); }
  if((m=v.match(/^(\d{4})-(\d{2})-(\d{2})/))) return new Date(+m[1],+m[2]-1,+m[3]);
  return null;
}
function idAviso(a){ let h=0; for(const c of norm(a.titulo+"|"+a.msg)) h=(h*33+c.charCodeAt(0))>>>0; return "a"+h.toString(36); }
function parseAvisos(rows){
  let hdr=rows.findIndex(r=>r.map(norm).some(c=>c.startsWith("mensagem")||c.startsWith("aviso")));
  if(hdr<0) throw Object.assign(new Error("Aba Avisos sem cabeçalho MENSAGEM"),{formato:true});
  const H=rows[hdr].map(norm), iT=H.findIndex(h=>h.startsWith("titulo")), iM=H.findIndex(h=>h.startsWith("mensagem")||h.startsWith("aviso")), iI=H.findIndex(h=>h.startsWith("inicio")), iF=H.findIndex(h=>h.startsWith("fim"));
  const hoje=today(), out=[];
  for(const r of rows.slice(hdr+1)){
    const a={titulo:iT>=0?String(r[iT]||"").trim():"", msg:String(r[iM]||"").trim(), ini:iI>=0?parseData(r[iI]):null, fim:iF>=0?parseData(r[iF]):null};
    if(!a.titulo&&!a.msg) continue;
    if(a.ini&&hoje<a.ini) continue; if(a.fim&&hoje>a.fim) continue;
    a.id=idAviso(a); out.push(a);
  }
  return out;
}
function lidos(){ return load(AV_LIDOS)||[]; }
function naoLidos(){ const l=lidos(); return AVISOS.filter(a=>!l.includes(a.id)); }
function atualizarBadge(){ const n=naoLidos().length, b=document.getElementById("badge"); b.hidden=!n; b.textContent=n; document.getElementById("sino").setAttribute("aria-label", n? `Avisos: ${n} novo${n>1?"s":""}` : "Avisos"); }
function fmtData(d){ return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; }
function linkify(t){ return esc(t).replace(/\bhttps?:\/\/[^\s<]+[^\s<.,;:!?)]/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`); }
function avisoHTML(a){ const per = a.fim ? `Até ${fmtData(a.fim)}` : ""; return `<article class="aviso">${a.titulo?`<h3>${esc(a.titulo)}</h3>`:""}<p>${linkify(a.msg)}</p>${per?`<small>${per}</small>`:""}</article>`; }
function mostrarAvisos(modo){
  const lista = modo==="novos" ? naoLidos() : AVISOS;
  if(modo==="novos" && !lista.length) return;
  document.getElementById("av-tit").textContent = modo==="novos" ? (lista.length>1?"Novos avisos":"Novo aviso") : "Avisos";
  document.getElementById("av-lista").innerHTML = lista.length ? `<div style="display:flex;flex-direction:column;gap:10px">${lista.map(avisoHTML).join("")}</div>` : `<p class="av-empty">Nenhum aviso no momento.</p>`;
  document.getElementById("av-acoes").innerHTML = modo==="novos"
    ? `<button class="btn primary" data-av="ok">Entendi</button><button class="btn" data-av="depois">Mostrar de novo na próxima vez</button>`
    : `<button class="btn primary" data-av="fechar">Fechar</button>${AVISOS.length?`<button class="btn" data-av="reexibir">Mostrar estes avisos ao abrir o app</button>`:""}`;
  lista.forEach(a=>vistosNaSessao.add(a.id));
  abrirFolha("avsheet");
  document.querySelector("#av-acoes .btn").focus();
}
function fecharAvisos(){ fecharFolha("avsheet"); atualizarBadge(); }
document.getElementById("avsheet").addEventListener("click",e=>{
  if(e.target.id==="avsheet"){ fecharAvisos(); return; }
  const b=e.target.closest("[data-av]"); if(!b) return;
  const acao=b.dataset.av;
  if(acao==="ok"){ store(AV_LIDOS,[...new Set([...lidos(),...naoLidos().map(a=>a.id)])]); }
  if(acao==="reexibir"){ const ids=AVISOS.map(a=>a.id); store(AV_LIDOS,lidos().filter(i=>!ids.includes(i))); }
  fecharAvisos();
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !document.getElementById("avsheet").hidden) fecharAvisos(); });
const vistosNaSessao=new Set();
function aplicarAvisos(rows){
  AVISOS=parseAvisos(rows); atualizarBadge();
  const novos=naoLidos().filter(a=>!vistosNaSessao.has(a.id));
  if(novos.length && document.getElementById("avsheet").hidden){ mostrarAvisos("novos"); }
}
async function carregarAvisos(){
  if(!CONFIG.avisos){ aplicarAvisos(AVISOS_EXEMPLO); return; }
  try{
    const r=await fetch(CONFIG.avisos+(CONFIG.avisos.includes("?")?"&":"?")+"_t="+Date.now(),{cache:"no-store"}); if(!r.ok) throw 0;
    const rows=parseCSV(await r.text()); parseAvisos(rows); store(AV_CACHE,rows); aplicarAvisos(rows);
  }catch(e){ const c=load(AV_CACHE); if(c){ try{ aplicarAvisos(c); }catch(_){} } }
}
document.getElementById("sino").addEventListener("click",()=>mostrarAvisos("todos"));

(function boot(){
  const c=load(CACHE_KEY);
  if(c&&c.rows&&(CONFIG.planilhas||[]).length){ try{ aplicar(c.rows, `Versão de ${fmt(c.ts)} · atualizando…`); }catch(e){} }
  carregar(false);
  carregarAvisos();
})();
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState!=="visible") return; if((CONFIG.planilhas||[]).length) carregar(false); if(CONFIG.avisos){ carregarAvisos(); } });
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
</script>
